<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Projects layered from hardware up to agents">
<style>text{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace}@keyframes L0{0%,3.00%{opacity:0;transform:translateY(14px)}8.00%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.L0{animation:L0 10.0s ease-out infinite}@keyframes P0{0%,30.00%{opacity:0}31.50%{opacity:.55}39.00%,100%{opacity:0}}.P0{animation:P0 10.0s ease-out infinite}@keyframes L1{0%,7.50%{opacity:0;transform:translateY(14px)}12.50%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.L1{animation:L1 10.0s ease-out infinite}@keyframes P1{0%,37.00%{opacity:0}38.50%{opacity:.55}46.00%,100%{opacity:0}}.P1{animation:P1 10.0s ease-out infinite}@keyframes L2{0%,12.00%{opacity:0;transform:translateY(14px)}17.00%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.L2{animation:L2 10.0s ease-out infinite}@keyframes P2{0%,44.00%{opacity:0}45.50%{opacity:.55}53.00%,100%{opacity:0}}.P2{animation:P2 10.0s ease-out infinite}@keyframes L3{0%,16.50%{opacity:0;transform:translateY(14px)}21.50%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.L3{animation:L3 10.0s ease-out infinite}@keyframes P3{0%,51.00%{opacity:0}52.50%{opacity:.55}60.00%,100%{opacity:0}}.P3{animation:P3 10.0s ease-out infinite}@keyframes L4{0%,21.00%{opacity:0;transform:translateY(14px)}26.00%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.L4{animation:L4 10.0s ease-out infinite}@keyframes P4{0%,58.00%{opacity:0}59.50%{opacity:.55}67.00%,100%{opacity:0}}.P4{animation:P4 10.0s ease-out infinite}@keyframes sig{0%,30%{transform:translateY(0);opacity:0}31%{opacity:1}62%{transform:translateY(-368px);opacity:1}66%,100%{transform:translateY(-368px);opacity:0}}

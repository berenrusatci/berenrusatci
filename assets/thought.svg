<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Thought experiments I keep coming back to">
<style>text{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace}@keyframes q0{0%{opacity:0;transform:translateY(8px)}3.333%,30.000%{opacity:1;transform:translateY(0)}33.333%,100%{opacity:0;transform:translateY(-8px)}}.q0{opacity:0;animation:q0 18.0s ease-in-out infinite}@keyframes d0{0%,0.000%{fill:#232b36}0.056%,33.333%{fill:#ff9f43}33.389%,100%{fill:#232b36}}.d0{animation:d0 18.0s linear infinite}@keyframes q1{0%,33.333%{opacity:0;transform:translateY(8px)}36.667%,63.333%{opacity:1;transform:translateY(0)}66.667%,100%{opacity:0;transform:translateY(-8px)}}.q1{opacity:0;animation:q1 18.0s ease-in-out infinite}@keyframes d1{0%,33.333%{fill:#232b36}33.389%,66.667%{fill:#ff9f43}66.722%,100%{fill:#232b36}}.d1{animation:d1 18.0s linear infinite}@keyframes q2{0%,66.667%{opacity:0;transform:translateY(8px)}70.000%,96.667%{opacity:1;transform:translateY(0)}100.000%,100%{opacity:0;transform:translateY(-8px)}}.q2{opacity:0;animation:q2 18.0s ease-in-out infinite}@keyframes d2{0%,66.667%{fill:#232b36}66.722%,100.000%{fill:#ff9f43}100.056%,100%{fill:#232b36}}.d2{animation:d2 18.0s linear infinite}</style>
<rect x="1" y="1" width="898" height="208" rx="14" fill="#11161d" stroke="#232b36"/>
<text x="34" y="44" fill="#6b7685" style="font-size:13px">// thought experiments I keep coming back to</text>
<rect class="d0" x="800" y="38" width="16" height="4" rx="2" fill="#232b36"/><rect class="d1" x="822" y="38" width="16" height="4" rx="2" fill="#232b36"/><rect class="d2" x="844" y="38" width="16" height="4" rx="2" fill="#232b36"/>
<g class="q0"><text x="34" y="74" fill="#7ee7ff" style="font-size:12px;letter-spacing:3px">SHIP OF THESEUS, v2</text><text x="34" y="112" fill="#d7dde5" style="font-size:18px">An agent rewrites my second brain one note at a time.</text><text x="34" y="144" fill="#d7dde5" style="font-size:18px">When the last original note is gone — is it still my mind?</text></g><g class="q1"><text x="34" y="74" fill="#7ee7ff" style="font-size:12px;letter-spacing:3px">THE SILENT CHECK</text><text x="34" y="112" fill="#d7dde5" style="font-size:18px">A security gate scanned zero files and reported “all clear”.</text><text x="34" y="144" fill="#d7dde5" style="font-size:18px">Did it lie, or did it simply never look?</text></g><g class="q2"><text x="34" y="74" fill="#7ee7ff" style="font-size:12px;letter-spacing:3px">WHOSE MEMORY</text><text x="34" y="112" fill="#d7dde5" style="font-size:18px">My assistant remembers last month better than I do.</text><text x="34" y="144" fill="#d7dde5" style="font-size:18px">At what point is the memory more its than mine?</text></g>
</svg>